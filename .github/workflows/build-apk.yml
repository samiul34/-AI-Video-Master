name: Build AI Video Master APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Arrange files into folders
        run: |
          mkdir -p app/src/main/java/com/aivideomaster/app app/src/main/res/values
          [ -f app_build.gradle ] && mv app_build.gradle app/build.gradle
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/aivideomaster/app/MainActivity.kt
          [ -f styles.xml ] && mv styles.xml app/src/main/res/values/styles.xml
          find . -path ./.git -prune -o -type f -print | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Master-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
